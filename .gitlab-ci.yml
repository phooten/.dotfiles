stages:
  - lint
  - test
  - release

shellcheck:
  stage: lint
  image: debian:bookworm-slim
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends shellcheck
    - shellcheck dotfiles.sh
    - shellcheck tests/*.sh

dotfiles-tests:
  stage: test
  image: debian:bookworm-slim
  needs:
    - shellcheck
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash stow
    - bash tests/test_dotfiles.sh

create-release-tag:
  stage: release
  image: alpine:3.20
  needs:
    - dotfiles-tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git bash
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    - |
      set -euo pipefail

      VERSION=$(awk '/^## \[/ { if ($2 != "[Unreleased]" ) { gsub(/[\[\]]/, "", $2); print $2; exit } }' CHANGELOG.md)

      if [ -z "$VERSION" ]; then
        echo "No release version found in CHANGELOG.md"
        exit 1
      fi

      TAG="v${VERSION}"

      if git rev-list -n 1 "$TAG" >/dev/null 2>&1; then
        echo "Tag $TAG already exists; skipping release tagging."
        exit 0
      fi

      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch --tags origin
      git tag "$TAG"
      git push origin "refs/tags/$TAG"

      echo "Created tag $TAG from main branch"
